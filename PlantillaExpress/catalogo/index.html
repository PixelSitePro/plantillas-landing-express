        .card-footer-color { background: var(--primary); width: 100%; padding: 15px; color: white; font-size: 0.75rem; font-weight: 600; }
        section { padding: 80px 8%; }

        .schedule-list { list-style: none; }
        .schedule-list li { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px dashed #a3e635; font-size: 1.1rem; }
        .map-responsive { width: 100%; height: 350px; border-radius: 10px; border: none; margin-top: 20px; }
        #contacto { background: var(--primary); color: white; text-align: center; }
        .social-icons { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
        .social-icons a { background: var(--bg-body); color: var(--primary); width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 1.2rem; text-decoration: none; transition: 0.3s ease; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); }
        .social-icons a:hover { background: var(--accent); color: var(--secondary); transform: translateY(-5px); }
        footer { background: var(--secondary); color: #cbd5e1; padding: 40px 8% 20px; text-align: center; }
